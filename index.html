<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Override · Live Scan</title>
<style>
:root{--bg:#070b14;--card:#111827;--line:rgba(148,163,184,.2);--text:#f1f5f9;--muted:#94a3b8;--accent:#22d3ee;--ok:#34d399}
*{box-sizing:border-box}body{margin:0;font:15px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--text)}
header{padding:14px 16px 8px}h1{margin:0;font-size:1.15rem}
.sub{color:var(--muted);font-size:.8rem;margin-top:2px}
.bar{display:flex;gap:8px;padding:0 16px 12px;flex-wrap:wrap}
button{min-height:44px;border-radius:10px;border:1px solid var(--line);background:#0f172a;color:var(--text);padding:8px 12px;font-weight:650}
.primary{background:linear-gradient(135deg,#22d3ee,#06b6d4);color:#082f36;border:0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 16px 24px}
.tile{aspect-ratio:1;border-radius:10px;border:2px solid transparent;background:#121826;display:grid;place-items:center;font-size:.68rem;text-align:center;padding:6px}
.tile.have{border-color:var(--ok)}.tile.out{opacity:.55}
.live{position:fixed;inset:0;background:#000;display:none;flex-direction:column}
.live.open{display:flex}
video{flex:1;width:100%;object-fit:cover}
.hud{padding:12px 14px calc(14px + env(safe-area-inset-bottom));background:#070b14}
.status{color:var(--accent);font-size:.85rem;min-height:2.2em}
.hits{display:flex;gap:8px;overflow:auto;min-height:42px}
.chip{flex:0 0 auto;border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:.75rem}
</style>
</head>
<body>
<header>
  <h1>Override locker</h1>
  <p class="sub">Phone live scan · same locker keys as the desktop dashboard</p>
</header>
<div class="bar">
  <button class="primary" id="scanBtn">Live scan</button>
  <button id="shotBtn">Scan screenshot</button>
</div>
<p class="sub" id="count" style="padding:0 16px 8px"></p>
<div class="grid" id="grid"></div>
<input id="file" type="file" accept="image/*" capture="environment" style="position:absolute;opacity:0;width:0;height:0"/>
<input id="shots" type="file" accept="image/*" multiple style="position:absolute;opacity:0;width:0;height:0"/>
<div class="live" id="live">
  <video id="vid" playsinline webkit-playsinline muted autoplay></video>
  <canvas id="cv" style="display:none"></canvas>
  <div class="hud">
    <p class="status" id="st">Opening camera…</p>
    <div class="hits" id="hits"></div>
    <div class="bar" style="padding:8px 0 0">
      <button class="primary" id="done">Done</button>
      <button id="snap">Snap / hard scan</button>
      <button id="cancel">Cancel</button>
    </div>
  </div>
</div>
<script src="sprite-fp.js"></script>
<script src="phone.js"></script>
</body>
</html>
